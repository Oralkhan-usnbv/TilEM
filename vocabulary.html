<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TilEM — Vocabulary</title>
  <link rel="stylesheet" href="vocabulary.css?v=2">
</head>
<body>

  <!-- Орнаменты -->
  <img src="Elements/ornament.png" class="ornament top-left" alt="Kazakh ornament">
  <img src="Elements/ornament.png" class="ornament top-right" alt="Kazakh ornament">
  <img src="Elements/ornament.png" class="ornament bottom-left" alt="Kazakh ornament">
  <img src="Elements/ornament.png" class="ornament bottom-right" alt="Kazakh ornament">

  <div class="app-viewport">

    <header class="top-header">
      <div class="header-left">
        <a href="index.html" class="back-link">← Back to Main</a>
      </div>
      <div class="header-logo">
        <h1 class="logo-title">Vocabulary</h1>
        <p class="subtitle">Learn new Kazakh words!</p>
      </div>
      <div class="header-right"></div>
    </header>

    <section class="vocab-summary">
      <div class="vocab-summary-left">
        <h2 class="section-title">My Vocabulary</h2>
        <p class="section-subtitle" id="wordCountSub">12 saved words</p>
      </div>
      <div class="vocab-summary-right">
        <button class="btn-add-word" id="openModalBtn" type="button">+ Add Word</button>
        <span class="words-badge" id="wordCountBadge">12 words</span>
      </div>
    </section>

    <main class="vocab-grid" id="wordsGrid"></main>

  </div>

  <!-- Окно поиска и добавления слова -->
  <div class="modal-overlay" id="addWordModal">
    <div class="modal-card">
      <h3>Add New Word</h3>
      <input type="text" id="searchInput" placeholder="Type in English or Kazakh..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="closeModalBtn" type="button">Close</button>
      </div>
    </div>
  </div>

  <footer class="footer-bar">
    <div class="footer-content">
      <span class="footer-item">📧 supportTilEM@gmail.com</span>
      <span class="footer-item footer-error">Found a mistake? Let us know!</span>
      <span class="footer-item">📞 +7 (707) 493-00-75</span>
    </div>
  </footer>

  <script src="words-db.js"></script>
  <script>
    const STORAGE_KEY = 'tilem_vocab_exact';

    const defaultWords = [
      { english: 'Hello',     kazakh: 'Сәлем',  trans: '[Salem]' },
      { english: 'Thank you', kazakh: 'Рақмет', trans: '[Raqmet]' },
      { english: 'Friend',    kazakh: 'Дос',    trans: '[Dos]' },
      { english: 'Family',    kazakh: 'Отбасы', trans: '[Otpasy]' },
      { english: 'Home',      kazakh: 'Үй',     trans: '[Uy]' },
      { english: 'School',    kazakh: 'Мектеп', trans: '[Mektep]' },
      { english: 'Book',      kazakh: 'Кітап',  trans: '[Kitap]' },
      { english: 'Water',     kazakh: 'Су',     trans: '[Su]' },
      { english: 'Food',      kazakh: 'Тамақ',  trans: '[Tamaq]' },
      { english: 'Good',      kazakh: 'Жақсы',  trans: '[Zhaqsy]' },
      { english: 'Beautiful', kazakh: 'Әдемі',  trans: '[Ademi]' },
      { english: 'Today',     kazakh: 'Бүгін',  trans: '[Bugin]' }
    ];

    /* Транслит */
    const TRANSLIT = {
      'а':'a','ә':'a','б':'b','в':'v','г':'g','ғ':'gh','д':'d','е':'e','ё':'yo',
      'ж':'zh','з':'z','и':'i','й':'y','к':'k','қ':'q','л':'l','м':'m','н':'n',
      'ң':'ng','о':'o','ө':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ү':'u',
      'ұ':'u','ф':'f','х':'kh','һ':'h','ц':'ts','ч':'ch','ш':'sh','щ':'shch',
      'ъ':'','ы':'y','і':'i','ь':'','э':'e','ю':'yu','я':'ya'
    };

    function transliterate(text) {
      let out = '';
      for (const ch of text.toLowerCase()) out += (ch in TRANSLIT) ? TRANSLIT[ch] : ch;
      return out.charAt(0).toUpperCase() + out.slice(1);
    }

    /* Соединение с базой */
    const DICT = KK_DICT_RAW.map(line => {
      const [kazakh, english] = line.split('|');
      return { kazakh, english, trans: '[' + transliterate(kazakh) + ']' };
    });

    /* Словарь */
    function getStoredWords() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) return JSON.parse(stored);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultWords));
      return defaultWords;
    }

    function saveWords(words) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    /* Дизайн слов */
    function renderWords(highlightIndex = -1) {
      const words = getStoredWords();
      const grid = document.getElementById('wordsGrid');

      document.getElementById('wordCountBadge').textContent = `${words.length} words`;
      document.getElementById('wordCountSub').textContent = `${words.length} saved words`;
      grid.innerHTML = '';

      words.forEach((item, index) => {
        const num = String(index + 1).padStart(2, '0');
        const card = document.createElement('div');
        card.className = 'vocab-card' + (index === highlightIndex ? ' vocab-card-new' : '');
        card.innerHTML = `
          <button class="btn-delete-word" onclick="deleteWord(${index})" title="Delete word" type="button">×</button>
          <div class="vocab-num">${num}</div>
          <div class="vocab-text">
            <div class="vocab-en">${escapeHtml(item.english)}</div>
            <div class="vocab-kk">${escapeHtml(item.kazakh)}</div>
            <div class="vocab-tr">${escapeHtml(item.trans || '')}</div>
          </div>
        `;
        grid.appendChild(card);
        if (index === highlightIndex) {
          setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
        }
      });
    }

    function deleteWord(index) {
      const words = getStoredWords();
      words.splice(index, 1);
      saveWords(words);
      renderWords();
    }

    /* Поиск */
    const modal = document.getElementById('addWordModal');
    const searchInput = document.getElementById('searchInput');
    const resultsBox = document.getElementById('searchResults');

    function openModal() {
      modal.classList.add('active');
      searchInput.value = '';
      resultsBox.innerHTML = '<div class="search-hint">Start typing to search the dictionary</div>';
      setTimeout(() => searchInput.focus(), 50);
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    // Чем меньше число, тем выше в списке
    function scoreEntry(entry, q) {
      const kk = entry.kazakh.toLowerCase();
      const tr = entry.trans.toLowerCase().replace(/[\[\]]/g, '');
      const enParts = entry.english.toLowerCase().split(/,\s*/);

      if (kk === q || enParts.includes(q)) return 0;
      if (kk.startsWith(q) || tr.startsWith(q) || enParts.some(p => p.startsWith(q))) return 1;
      if (entry.english.toLowerCase().includes(q) || kk.includes(q) || tr.includes(q)) return 2;
      return -1;
    }

    function searchDict(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      return DICT
        .map(entry => ({ entry, score: scoreEntry(entry, q) }))
        .filter(r => r.score >= 0)
        .sort((a, b) => a.score - b.score)
        .slice(0, 8)
        .map(r => r.entry);
    }

    function renderResults() {
      const query = searchInput.value;
      if (!query.trim()) {
        resultsBox.innerHTML = '<div class="search-hint">Start typing to search the dictionary</div>';
        return;
      }

      const results = searchDict(query);
      if (results.length === 0) {
        resultsBox.innerHTML = '<div class="search-hint">Nothing found. Try another spelling.</div>';
        return;
      }

      const saved = getStoredWords().map(w => w.kazakh.toLowerCase());
      resultsBox.innerHTML = '';

      results.forEach(entry => {
        const already = saved.includes(entry.kazakh.toLowerCase());
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'search-item' + (already ? ' search-item-added' : '');
        row.innerHTML = `
          <div class="search-item-main">
            <span class="search-kk">${escapeHtml(entry.kazakh)}</span>
            <span class="search-tr">${escapeHtml(entry.trans)}</span>
          </div>
          <span class="search-en">${already ? '✓ Added' : escapeHtml(entry.english)}</span>
        `;
        if (!already) row.onclick = () => addWord(entry);
        resultsBox.appendChild(row);
      });
    }

    function addWord(entry) {
      const words = getStoredWords();
      words.push({ english: entry.english, kazakh: entry.kazakh, trans: entry.trans }); // в конец списка
      saveWords(words);
      closeModal();
      renderWords(words.length - 1);
    }

    document.getElementById('openModalBtn').onclick = openModal;
    document.getElementById('closeModalBtn').onclick = closeModal;
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    searchInput.addEventListener('input', renderResults);

    renderWords();
  </script>
</body>
</html>
