<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dialogue — TilEM</title>

  <link rel="stylesheet" href="dialogue.css">
</head>

<body>

  <!-- Орнаменты -->
  <img src="Elements/ornament.png"
       class="ornament top-left"
       alt="Kazakh ornament">

  <img src="Elements/ornament.png"
       class="ornament top-right"
       alt="Kazakh ornament">

  <img src="Elements/ornament.png"
       class="ornament bottom-left"
       alt="Kazakh ornament">

  <img src="Elements/ornament.png"
       class="ornament bottom-right"
       alt="Kazakh ornament">


  <main class="dialogue-page">

    <!-- Название страницы -->
    <header class="dialogue-header">
      <h1>Dialogue</h1>
      <p>Practice your speaking skills</p>
    </header>


    <!-- Сценарий -->
    <section class="scenario-bar">
      <span>Scenario: <strong>Ordering food</strong></span>
    </section>


    <!-- Основной блок -->
    <section class="dialogue-box">

      <!-- Здесь позже можно выводить сообщения -->
      <div class="messages">

        <div class="message ai-message">
          <span class="message-name">TilEM</span>
          <p>Hello! Welcome to our restaurant. What would you like to order?</p>
        </div>

      </div>


      <!-- Поле ответа -->
      <div class="answer-area">

        <input
          type="text"
          placeholder="Your answer"
          id="answerInput"
        >

        <button class="microphone-button" type="button" aria-label="Microphone">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round">

            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>

            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>

            <line x1="12" y1="19" x2="12" y2="22"></line>

            <line x1="8" y1="22" x2="16" y2="22"></line>

          </svg>

        </button>

      </div>

    </section>

  </main>

</body>
</html>
